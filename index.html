<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FiŠi-box Hall of Fame</title>
<style>
:root{--card:#111d2e;--text:#f8fafc;--muted:#9fb0c7;--green:#22c55e;--blue:#3b82f6;--gold:#fbbf24;--line:#26364d;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(160deg,#06101f,#10213b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:auto}.card{background:rgba(17,29,46,.97);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 12px 34px #0004}h1,h2{margin:0 0 12px;text-align:center}.sub,.stats{text-align:center;color:var(--muted);margin-bottom:16px}.label,.qtitle{display:block;font-weight:750;margin:18px 0 8px}select,input[type=text]{width:100%;min-height:50px;padding:12px 14px;border:1px solid #3a4c66;border-radius:12px;background:#0a1525;color:var(--text);font-size:17px}.rating{display:flex;justify-content:center;gap:4px}.star{font-size:43px;color:#4b596c;background:none;border:0;padding:3px;line-height:1;cursor:pointer}.star.on{color:var(--gold)}button.action{width:100%;min-height:52px;border:0;border-radius:13px;margin-top:12px;padding:12px;font-size:17px;font-weight:800;color:#fff;background:var(--green)}.reload{background:var(--blue)!important}.message{text-align:center;min-height:24px;margin-top:10px;font-weight:700}.ranking{display:grid;gap:9px}.row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;background:#0a1525;border:1px solid var(--line);border-radius:14px;padding:11px}.rank{font-size:22px;text-align:center}.game{font-weight:800}.detail{font-size:13px;color:var(--muted);margin-top:3px}.score{text-align:right;color:var(--gold);font-weight:900}.empty{text-align:center;color:var(--muted);padding:18px}.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:12px}
</style>
</head>
<body><main class="app">
<section class="card"><h1>🎮 FiŠi-box Hall of Fame</h1><div class="sub">Rodinné hodnotenie hier</div><div class="stats" id="counter">Pripájam databázu…</div>
<label class="label" for="player">Hráč</label><select id="player"><option>Jakubko</option><option>Timka</option><option>Julka</option><option>Filipko</option><option>Šimonko</option><option>Tati</option><option>Mami</option></select>
<label class="label" for="game">Hra</label><input id="game" type="text" maxlength="80" autocomplete="off" placeholder="napr. Micro Machines 2"><div id="questions"></div>
<button class="action" id="saveBtn">💾 Uložiť hodnotenie</button><div class="message" id="msg" aria-live="polite"></div></section>
<section class="card"><h2>🏆 Automatický TOP 10</h2><div class="sub">Spoločný rebríček zo všetkých zariadení</div><div id="ranking" class="ranking"></div><button class="action reload" id="reloadBtn">🔄 Obnoviť rebríček</button><div class="note">Dáta sa ukladajú do Cloud Firestore. Pri rovnosti rozhoduje vyšší počet hodnotení.</div></section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

// VLOŽ SEM KONFIGURÁCIU, KTORÚ TI FIREBASE ZOBRAZÍ PRI REGISTRÁCII WEB APPKY.
const firebaseConfig = {
  apiKey: "AIzaSyCCy8D5_PQ0jQc4HQku8IATs2XbGIf1KJQ",
  authDomain: "fisibox-hall-of-fame.firebaseapp.com",
  projectId: "fisibox-hall-of-fame",
  storageBucket: "fisibox-hall-of-fame.firebasestorage.app",
  messagingSenderId: "155243338136",
  appId: "1:155243338136:web:27412d5ecb83a7d8c1f3ed"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const qs=['Aká bola zábava?','Aká bola hrateľnosť?','Chceš hrať znova?','Bolo ovládanie jednoduché?','Odporučil by si hru ostatným?'];
const answers=Array(qs.length).fill(0), qbox=document.getElementById('questions');
qs.forEach((q,qi)=>{const wrap=document.createElement('div');wrap.innerHTML=`<div class="qtitle">${q}</div><div class="rating"></div>`;const r=wrap.querySelector('.rating');for(let n=1;n<=5;n++){const b=document.createElement('button');b.type='button';b.className='star';b.textContent='★';b.setAttribute('aria-label',`${n} z 5`);b.onclick=()=>{answers[qi]=n;[...r.children].forEach((x,i)=>x.classList.toggle('on',i<n))};r.appendChild(b)}qbox.appendChild(wrap)});
function flash(t,bad=false){const m=document.getElementById('msg');m.textContent=t;m.style.color=bad?'#fca5a5':'#86efac';setTimeout(()=>{if(m.textContent===t)m.textContent=''},3200)}
function normalize(s){return String(s||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('sk-SK')}
function render(data){document.getElementById('counter').textContent=`Počet hodnotení: ${data.length}`;const G={};data.forEach(r=>{const k=normalize(r.game),v=[r.fun,r.gameplay,r.again,r.controls,r.recommend].map(Number);if(!k||v.some(x=>!Number.isFinite(x)))return;if(!G[k])G[k]={name:r.game,sum:0,count:0};G[k].sum+=v.reduce((a,b)=>a+b,0)/5;G[k].count++});const rows=Object.values(G).map(x=>({...x,avg:x.sum/x.count})).sort((a,b)=>b.avg-a.avg||b.count-a.count||a.name.localeCompare(b.name,'sk')).slice(0,10),box=document.getElementById('ranking');box.innerHTML='';if(!rows.length){box.innerHTML='<div class="empty">Zatiaľ nie sú hodnotenia.</div>';return}rows.forEach((r,i)=>{const e=document.createElement('div');e.className='row';const medal=['🥇','🥈','🥉'][i]||`${i+1}.`,stars='★'.repeat(Math.round(r.avg))+'☆'.repeat(5-Math.round(r.avg));e.innerHTML=`<div class="rank">${medal}</div><div><div class="game"></div><div class="detail">${r.count} ${r.count===1?'hodnotenie':'hodnotení'}</div></div><div class="score">${r.avg.toFixed(2)}<br>${stars}</div>`;e.querySelector('.game').textContent=r.name;box.appendChild(e)})}
async function load(){try{const snap=await getDocs(query(collection(db,'ratings'),orderBy('createdAt','desc')));render(snap.docs.map(x=>x.data()))}catch(e){console.error(e);flash('Rebríček sa nepodarilo načítať.',true)}}
async function save(){const game=document.getElementById('game').value.trim(),player=document.getElementById('player').value;if(!game)return flash('Zadaj názov hry.',true);if(answers.some(x=>x<1))return flash('Vyplň všetkých 5 hodnotení.',true);document.getElementById('saveBtn').disabled=true;try{await addDoc(collection(db,'ratings'),{player,game,gameKey:normalize(game),fun:answers[0],gameplay:answers[1],again:answers[2],controls:answers[3],recommend:answers[4],createdAt:serverTimestamp()});flash('✅ Hodnotenie uložené');document.getElementById('game').value='';answers.fill(0);document.querySelectorAll('.star').forEach(x=>x.classList.remove('on'));await load()}catch(e){console.error(e);flash('Uloženie zlyhalo. Skontroluj Firebase pravidlá.',true)}finally{document.getElementById('saveBtn').disabled=false}}
document.getElementById('saveBtn').onclick=save;document.getElementById('reloadBtn').onclick=load;
try{await signInAnonymously(auth);await load()}catch(e){console.error(e);document.getElementById('counter').textContent='Firebase nie je pripojený';flash('Chyba: ' + e.code + ' – ' + e.message, true)}
</script></body></html>
